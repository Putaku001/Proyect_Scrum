<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Verse - La Página Definitiva de Manga</title>
  <link rel="stylesheet" href="/pagina_proyecto/css/style.css">
</head>
<body>
  <!-- Header Fijo y Animado -->
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="./assets/imgs/Logito.png" alt="Logo Manga Verse" class="header-logo">
        <span>Manga Verse</span>
      </div>
      <nav>
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Mi Lista</a></li>
          <li><a href="#">Catálogo</a></li>
        </ul>
      </nav>
      <div class="theme-switcher">
        <button id="theme-toggle" aria-label="Cambiar tema">
          <span class="dark-icon">🌙</span>
          <span class="light-icon">☀️</span>
        </button>
      </div>
      <div class="profile">
        <a href="./Public/login.html" id="login-link">Iniciar Sesión</a>
      </div>
    </div>
  </header>

  <!-- Sección Hero -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Bienvenido a Manga Verse</h1>
      <p>La experiencia definitiva en streaming de manga. Sumérgete en historias que te transformarán.</p>
      <button id="explore-btn">Descubre lo Increíble</button>
    </div>
  </section>

  <!-- Slider de Recomendados (sin funcionalidad de lectura) -->
  <main>
    <section class="slider-section" id="recomendados">
      <h2>Recomendados</h2>
      <div class="slider">
        <button class="slider-btn left" onclick="slideLeft('recomendados-slider')">&#10094;</button>
        <div class="slider-container" id="recomendados-slider">
          <!-- Solo se muestran las portadas, sin enlaces ni funciones -->
          <div class="manga-card">
            <img src="./assets/imgs/koe no katachi.jpg" alt="Manga 1">
          </div>
          <div class="manga-card">
            <img src="./assets/imgs/Kurosawa.jpg" alt="Manga 2">
          </div>
          <div class="manga-card">
            <img src="./assets/imgs/akunohana.jpg" alt="Manga 3">
          </div>
          <div class="manga-card">
            <img src="./assets/imgs/ruri-dragon-vol1.jpg" alt="Manga 4">
          </div>
          <div class="manga-card">
            <img src="./assets/imgs/yourname.jpg" alt="Manga 5">
          </div>
          <div class="manga-card">
            <img src="./assets/imgs/KS.jpg" alt="Manga 6">
          </div>
          <div class="manga-card">
            <img src="./assets/imgs/LOTM.webp" alt="Manga 7">
          </div>
        </div>
        <button class="slider-btn right" onclick="slideRight('recomendados-slider')">&#10095;</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Manga Verse. Todos los derechos reservados.</p>
  </footer>

  <script src="/pagina_proyecto/js/theme-switcher.js"></script>
  <script src="/pagina_proyecto/js/script.js"></script>
</body>
</html>
