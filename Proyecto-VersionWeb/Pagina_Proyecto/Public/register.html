<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | ProyectAti</title>
  <link rel="stylesheet" href="../assets/css/style.css"> <!-- Asegúrate de tener este CSS enlazado -->
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="../assets/imgs/Logito.png" alt="Logo Manga Verse" class="header-logo" />
        <span>Manga Verse</span>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="../Pages/Client/favoritos.php">Mi Lista</a></li>
          <li><a href="../Pages/catalogo.php">Catálogo</a></li>
        </ul>
      </nav>

      <!-- Selector de tema oscuro/claro -->
      <div class="theme-switcher">
        <button id="theme-toggle" aria-label="Cambiar tema">
          <span class="dark-icon">🌙</span> <!-- Icono para tema oscuro -->
          <span class="light-icon">☀️</span> <!-- Icono para tema claro -->
        </button>
      </div>

      <div class="profile">
        <a href="login.html" id="login-link">Iniciar Sesión</a>
      </div>
    </div>
  </header>

  <!-- FORMULARIO DE REGISTRO -->
  <div class="login-container" style="margin-top: 100px;">
    <div class="login-box">
      <h2>Crear cuenta</h2>
      <form action="../Auth/register.php" method="POST">
        <label for="nombre">Nombre de usuario</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre de usuario">

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Contraseña segura">

        <button type="submit">Registrarse</button>
        <p style="margin-top: 1rem; text-align: center;">¿Ya tienes cuenta? <a href="login.html" style="color: #8a2be2;">Inicia sesión</a></p>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    &copy; 2025 ProyectAti. Todos los derechos reservados.
  </footer>

  <!-- Script para el cambio de tema -->
  <script src="../assets/js/theme-switcher.js"></script>
</body>
</html>
